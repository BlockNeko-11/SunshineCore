architectury {
    common(rootProject.enabled_platforms.split(",")) {
        it.platformPackage "neoforge", "forge"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/sunshinecore.accesswidener")
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    // modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"

    implementation "net.jodah:typetools:${rootProject.type_tools_version}"

    implementation "com.github.BlockNeko-11.UnifiedConfig:unified-config-core:${rootProject.unified_config_version}"
    implementation "com.github.BlockNeko-11.UnifiedConfig:unified-config-gson:${rootProject.unified_config_version}"
}
